manifestVersion: 1.1
id: brainchainz-monero-superatomic
category: finance
name: Monero SuperAtomic
icon: http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/icon.png
version: "0.4.9"
tagline: Run an Automated Swap Backend to provide XMR liquidity
description: >-
  Monero SuperAtomic is a self-hosted Automated Swap Backend for XMR/BTC atomic
  swaps. It lets you provide Monero liquidity to the Eigen network from your
  Umbrel, with a built-in web dashboard for funding, swap tracking, balances,
  BTC withdrawals, peer connectivity, logs, and full wallet backup and restore.
  It automatically connects to your Umbrel's Monero node and Bitcoin Electrs
  server.
developer: brainchainz
website: https://eigenwallet.org
dependencies:
  - monero
  - bitcoin
  - electrs
repo: https://github.com/brainchainz/Monero-Superbrain
support: https://github.com/brainchainz/Monero-Superbrain/issues
port: 8085
gallery:
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/1.png
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/2.png
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/3.png
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/4.png
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/5.png
  - http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superatomic/gallery/6.png
path: ""
defaultPassword: null
torOnly: false
releaseNotes: >-
  Updates the swap engine to Eigen ASB 4.13.2, which fixes bugs in the swap
  setup protocol and in Bitcoin output selection. Adds a Hide button that masks
  every identifying value (addresses, peer id, transaction ids, seeds, balances,
  and swap amounts) for screenshots and screen sharing, the XMR/BTC market rate
  in the top bar, and the current spread in the offer panel.

manifestVersion: 1.1
id: brainchainz-monero-superatomic
category: finance
name: Monero SuperAtomic
icon: icon.png
version: "0.4.11"
tagline: Run an Automated Swap Backend to provide XMR liquidity
description: >-
  Monero SuperAtomic is a self-hosted Automated Swap Backend for XMR/BTC atomic
  swaps. It lets you provide Monero liquidity to the Eigen network from your
  Umbrel, with a built-in web dashboard for funding, swap tracking, balances,
  BTC withdrawals, peer connectivity, logs, and full wallet backup and restore.
  It automatically connects to your Umbrel's Monero node and Bitcoin Electrs
  server.
developer: brainchainz
website: https://eigenwallet.org
dependencies:
  - monero
  - bitcoin
  - electrs
repo: https://github.com/brainchainz/Monero-Superbrain
support: https://github.com/brainchainz/Monero-Superbrain/issues
port: 8085
gallery:
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/1.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/2.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/3.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/4.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/5.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/6.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superatomic/gallery/7.png
path: ""
defaultPassword: null
torOnly: false
releaseNotes: >-
  Privacy mode now masks swap and transaction timestamps as well. The swap and
  activity lists already hid amounts, addresses, and transaction ids, but the
  date and time of each entry can be correlated against the public blockchains
  to identify your activity, so they are hidden with everything else. Updating
  is also smoother: the dashboard no longer needs a hard refresh after an
  update, because a page cached from an earlier version now loads the current
  app instead of showing a blank screen. Config gains a Swap Engine section
  reporting the ASB version the app is running.

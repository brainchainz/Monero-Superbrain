services:
  # Umbrel's reverse proxy, which also provides auth and the Tor address.
  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    container_name: brainchainz_monero_supersync_app_proxy
    restart: on-failure
    environment:
      - APP_HOST=brainchainz_monero_supersync_server
      - APP_PORT=4051
      - PROXY_AUTH_ADD_HEADER_PREFIX=X-Webauth-
    networks:
      - default

  # The wallet server. It supervises one monero-wallet-rpc child process per
  # wallet inside this same container, which is why the image carries both
  # binaries and why nothing here exposes a wallet RPC port. Those children
  # listen on 127.0.0.1 only and are unreachable from outside the container.
  server:
    # Pinned by digest as well as tag, so a retagged image cannot silently
    # replace the one that was tested. Bump both together on release.
    image: sirjamzalot/monero-supersync:0.1.0@sha256:f2a6e40650407b661a01e6ea2aaf1bfd9c92e2373df0d5762ee063fa202d580c
    container_name: brainchainz_monero_supersync_server
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    environment:
      - PORT=4051
      - DATA_DIR=/data
      - WALLET_RPC_BIN=/usr/local/bin/monero-wallet-rpc
      - APP_SECRET=${APP_SEED}
      - FIAT_CURRENCY=${APP_MONERO_SUPERSYNC_FIAT:-USD}
      - SERVER_URL=http://${DEVICE_DOMAIN_NAME:-umbrel.local}:${APP_MONERO_SUPERSYNC_PORT:-4051}
      # Supplied automatically by the official Monero app, see exports.sh.
      - MONERO_NODE_IP=${APP_MONERO_NODE_IP:-monero_monerod_1}
      - MONERO_RPC_PORT=${APP_MONERO_RPC_PORT:-18081}
      - MONERO_RPC_USER=${APP_MONERO_RPC_USER:-monero}
      - MONERO_RPC_PASS=${APP_MONERO_RPC_PASS:-monero}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks:
      - default
      # Required to reach monerod, which lives on Umbrel's shared network.
      - umbrel_main_network

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.21.${SUBNET_ID:-41}.0/24
  umbrel_main_network:
    external: true

releaseNotes: >-
  v0.2.0: Device pairing. Open the app, set up the first device, then use Pair
  another device to show a QR your phone can scan. The code changes every 30
  seconds. Your phone shows a four digit number and the first screen offers
  three; tap the one your phone shows. A wrong tap cancels pairing, so someone
  who photographed the screen gets one chance in three, once.

  Every request from a paired device is signed by a key generated on that
  device and held in hardware the page cannot read.

  Sending is now possible, guarded by each device's role and daily limit. There
  is no biometric step in this build, so set a limit per device on the Devices
  screen and keep it to what you would not mind losing. Serving the app over
  HTTPS enables Face ID or fingerprint approval on top.

  v0.1.1: Fixes a failure to start. The app data directory is created by
  exports.sh, which runs as root, while the container runs as uid 1000, so the
  server could not create its own database and restarted in a loop. The
  directory is now given to uid 1000 before the container starts. Same image as
  v0.1.0, packaging fix only.

  v0.1.0: First preview. Connects to your Monero node automatically, creates and
  restores wallets, and keeps every one of them open and refreshing so they are
  never behind. Shows node status, per wallet sync progress and balances.

  Sending is deliberately switched off in this build. The device pairing and
  passkey approval that guard spending are not finished, and shipping a send
  button without them would mean anyone who could reach the app could move your
  funds. Receiving works, so you can point it at a wallet and watch it stay
  caught up.

  Treat this as a preview. Restore a wallet you already have a backup of, or
  create a fresh one and keep the amount small.

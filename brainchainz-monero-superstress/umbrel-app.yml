name: Monero Superstress
icon: http://umbrel.local:8101/brainchainz/monero-superbrain/raw/branch/main/brainchainz-monero-superstress/icon.png
version: "1.8.5"
tagline: Stress-test the bleeding edge of Monero privacy
description: >-
  Run a full Monero FCMP++ stressnet node on your Umbrel, routed exclusively
  through Tor. FCMP++ (Full-Chain Membership Proofs) is the upcoming privacy
  upgrade that eliminates ring signature limitations. This stressnet lets you
  test it before mainnet launch.


  Features a premium dark dashboard to monitor sync progress, network stats,
  peer connections, and difficulty. Includes a built-in wallet lab for creating
  wallets, sending test FCMP++ transactions, solo mining, and spamming the
  stressnet with test transactions.


  All traffic is routed through Tor — zero clearnet connections. Your IP is
  never exposed during testing. The stressnet has a low anonymity set, so Tor
  routing is critical for protecting testers.
releaseNotes: >-
  v1.8.5: Spammer wallet overhaul, aligned with the latest upstream xmrspammer
  design. The spam loop now sweeps leaf accounts round-robin (self-churn)
  instead of self-sending a fixed amount that exceeded each leaf's balance, so
  spam transactions actually broadcast. The spammer log panel works (it was
  wired to a field that never existed), the wallet auto-resumes after a
  restart instead of dead-ending on "create" for a wallet that already exists,
  and tree building now funds up to 15 leaves per transaction with automatic
  waits for change to unlock, with live progress in the UI. Wallet state is
  saved to disk periodically and on stop, the UI shows wallet sync status and
  blocks the spam loop until the wallet is ready, and recovery tools (flush
  txpool, rescan) talk to the right daemon address again.
  v1.8.4: Network Monitor overhaul. New Sync Health section shows the metrics
  that actually decide whether a Tor-only node converges: blocks behind, sync
  rate vs tip growth, peer uptime, catch-up ETA, and a peer-ban timeline.
  Fixes the Block Weight and Block Reward charts, which had recorded zeros
  since launch (the daemon's last-block RPC returns empty fields on this
  FCMP++ build, so the monitor now fetches the top block by height). Wide
  time windows are now downsampled server-side so week/all charts render
  fast, and monitor data older than 30 days is pruned automatically.
  v1.8.3: Makes Tor-only sync actually converge. The node now connects
  exclusively to the stressnet's live nodes instead of burning Tor circuits on
  dozens of long-dead peers from the stored peerlist, and ships a tuned Tor
  sidecar that fails bad exit paths in 15 seconds (instead of hanging for 2
  minutes) and keeps reusing exits that allow the stressnet port instead of
  rotating to a random one every 10 minutes. Together these multiply the time
  the node actually holds a peer, which is what sync speed over Tor comes down
  to.
  v1.8.2: Fixes Tor-only sync. The node routes all peer traffic through Tor, and
  the previous block-batch size was too large to transfer through a Tor circuit
  before the daemon's timeout, so it banned every peer as "too slow" and the
  chain stayed stuck tens of thousands of blocks behind. Sync now requests one
  block at a time, which completes over Tor and lets the node steadily catch up
  (first sync is slow but reliable; steady-state tip-following is quick). Also
  fixes the dashboard sync meter, which showed "Synchronized" while the node was
  still tens of thousands of blocks behind: it now judges sync on actual blocks
  behind the highest known network tip, and shows "Searching for peers" during
  Tor peer gaps instead of a false 100%.
  v1.8.1: Fixes the app so it runs again. The web and explorer-relay images are
  now multi-arch (amd64 + arm64), the web image was arm64-only and would not
  start on amd64 Umbrels. Replaced the abandoned Tor proxy with a current build
  that actually connects (the old one could no longer bootstrap, which stalled
  the node's Tor-routed sync). Pinned all image versions. Also: block explorer
  pagination, cleaner spammer wallet flow, and fresh-install permission fixes.

services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    container_name: brainchainz_monero_superstress_app_proxy
    restart: on-failure
    environment:
    - APP_HOST=brainchainz_monero_superstress_web
    - APP_PORT=4050
    networks:
    - umbrel_main_network
  # Multi-arch Tor sidecar tuned for monerod P2P sync over Tor: SocksTimeout 15
  # (fail bad exits fast) + MaxCircuitDirtiness 86400 (stick to exits that
  # allow port 28080). Source: tor/ in the monero-superstress repo.
  # Self-contained: no torrc mount, no command. Static IP is safe here because
  # it lives on the dedicated stressnet subnet, not the shared Umbrel network.
  tor:
    image: sirjamzalot/superstress-tor:v1.0
    container_name: brainchainz_monero_superstress_tor
    restart: on-failure
    networks:
      stressnet:
        ipv4_address: 10.99.10.10
  monerod:
    image: sirjamzalot/monero-stressnet:v1.8.1
    container_name: brainchainz_monero_superstress_monerod
    restart: on-failure
    entrypoint:
      - monerod
    # block-sync-size=1 is REQUIRED for Tor-only sync. All P2P goes through the
    # single Tor SOCKS circuit (--proxy). Larger batches can't be delivered
    # within monerod's span window, so it bans every peer as "too slow" and the
    # node never advances (was stuck 23k blocks behind). One block per request
    # completes over Tor before the ban timer, so the chain crawls forward. Slow
    # on first sync but reliable; do not raise this while Tor-only.
    command: --testnet --prune-blockchain --sync-pruned-blocks --block-sync-size=1
      --non-interactive --rpc-bind-ip=0.0.0.0 --rpc-bind-port=28081 --confirm-external-bind
      --proxy=10.99.10.10:9050
      --tx-proxy=tor,10.99.10.10:9050,disable_noise
      --out-peers=3 --in-peers=8 --data-dir=/data --no-igd
      --add-exclusive-node=207.180.199.254:28080
      --add-exclusive-node=148.63.215.132:28080
      --add-exclusive-node=116.203.98.127:28080
    volumes:
    - ${APP_DATA_DIR}/db:/data
    depends_on:
    - tor
    networks:
      stressnet:
        ipv4_address: 10.99.10.11
  wallet-rpc:
    image: sirjamzalot/monero-stressnet:v1.8.1
    container_name: brainchainz_monero_superstress_wallet_rpc
    restart: on-failure
    entrypoint:
    - monero-wallet-rpc
    command: --testnet --daemon-address=10.99.10.11:28081
      --wallet-dir=/home/monero/wallet --rpc-bind-ip=0.0.0.0 --rpc-bind-port=28083
      --disable-rpc-login --confirm-external-bind --trusted-daemon
    volumes:
    - ${APP_DATA_DIR}/wallet:/home/monero/wallet
    depends_on:
    - monerod
    networks:
      stressnet:
        ipv4_address: 10.99.10.12
  spammer-wallet-rpc:
    image: sirjamzalot/monero-stressnet:v1.8.1
    container_name: brainchainz_monero_superstress_spammer_wallet_rpc
    restart: on-failure
    entrypoint:
    - monero-wallet-rpc
    command: --testnet --daemon-address=10.99.10.11:28081
      --wallet-dir=/home/monero/spammer-wallet --rpc-bind-ip=0.0.0.0 --rpc-bind-port=28084
      --disable-rpc-login --confirm-external-bind --trusted-daemon
    volumes:
    - ${APP_DATA_DIR}/spammer-wallet:/home/monero/spammer-wallet
    depends_on:
    - monerod
    networks:
      stressnet:
        ipv4_address: 10.99.10.13
  relay:
    image: sirjamzalot/monero-stressnet-relay:v1.8.1
    container_name: brainchainz_monero_superstress_relay
    restart: on-failure
    environment:
      - MONEROD_HOST=10.99.10.11
      - MONEROD_RPC_PORT=28081
      - SERVER_PORT=3001
      - DB_PATH=/data/relay.db
    volumes:
      - ${APP_DATA_DIR}/relay:/data
    depends_on:
      - monerod
    networks:
      stressnet:
        ipv4_address: 10.99.10.14
  web:
    image: sirjamzalot/monero-stressnet-web:v1.8.5
    container_name: brainchainz_monero_superstress_web
    restart: on-failure
    environment:
    - PORT=4050
    - MONEROD_RPC=http://10.99.10.11:28081
    - WALLET_RPC=http://10.99.10.12:28083
    - SPAMMER_WALLET_RPC=http://10.99.10.13:28084
    - SPAMMER_WALLET_DIR=/spammer-wallets
    - MONITOR_DB_PATH=/data/monitor.db
    - RELAY_RPC=http://10.99.10.14:3001
    volumes:
    - ${APP_DATA_DIR}/monitor:/data
    - ${APP_DATA_DIR}/wallet:/wallet-files
    # Read-only view of the spammer wallet dir so the web backend can tell
    # whether a wallet file exists (otherwise every restart offered "Create",
    # which then failed with "file already exists").
    - ${APP_DATA_DIR}/spammer-wallet:/spammer-wallets:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_DATA_DIR}/db:/data/db:ro
    depends_on:
    - monerod
    - wallet-rpc
    - spammer-wallet-rpc
    networks:
    - stressnet
    - umbrel_main_network
networks:
  stressnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.10.0/24
  umbrel_main_network:
    external: true

path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  v1.2.1: Store export/import (.superpay files) now carries all products, images, settings,
  and wallet credentials for full cross-platform portability (Mac to Umbrel and back).
  POS devices bypass Umbrel password — QR scan goes straight to the terminal.
  Wallet file management (list, connect, delete) in Settings.
  Tor .onion address auto-detected and shown in Settings.
  Accurate wallet sync progress display.
  Manual node picker (public, custom, Tor) alongside Umbrel's auto-configured node.
  Order cancellation fix. Receipt print fix. PIN lock screen.
  Security hardening: rate limiting, CSV injection prevention, WebSocket store filtering,
  wallet overwrite protection.

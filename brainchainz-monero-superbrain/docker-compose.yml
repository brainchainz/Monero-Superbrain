services:
  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    container_name: monero_superbrain_app_proxy
    restart: on-failure
    environment:
      - APP_HOST=monero_superbrain_dashboard
      - APP_PORT=3000
      - LOG_LEVEL=debug
    networks:
      - default
      - umbrel_main_network

  dashboard:
    image: sirjamzalot/monero-superbrain-dashboard:v1.5.2
    container_name: monero_superbrain_dashboard
    restart: always
    environment:
      - APP_DATA_DIR=${APP_DATA_DIR:-/data}
      - APP_MONERO_NODE_IP=${APP_MONERO_NODE_IP:-monero_monerod_1}
      - APP_MONERO_RPC_PORT=${APP_MONERO_RPC_PORT:-18081}
      - APP_MONERO_ZMQ_PORT=${APP_MONERO_ZMQ_PORT:-18083}
      - APP_MONERO_RPC_USER=${APP_MONERO_RPC_USER:-monero}
      - APP_MONERO_RPC_PASS=${APP_MONERO_RPC_PASS:-monero}
      - WALLET_ADDRESS=${WALLET_ADDRESS}
      - DEV_WALLET=${DEV_WALLET}
      - DEV_FEE_PERCENT=${DEV_FEE_PERCENT}
      - P2POOL_CHAIN=${P2POOL_CHAIN}
      - XMRIG_THREADS=${XMRIG_THREADS}
      # Route p2pool.observer lookups (payouts + shares) through the Tor
      # sidecar so the Umbrel's public IP is never exposed to the observer.
      # Umbrel home servers have no VPN; clearnet stays opt-in only.
      - TOR_PROXY_URL=socks5h://monero_superbrain_tor:9050
      - OBSERVER_ALLOW_CLEARNET=${OBSERVER_ALLOW_CLEARNET:-false}
      # Scoped Docker control goes through the control-proxy sidecar, not a
      # mounted host socket. CONTROL_TOKEN is generated per-install in exports.sh
      # and shared only between these two containers.
      - CONTROL_PROXY_URL=http://monero_superbrain_control_proxy:2375
      - CONTROL_TOKEN=${CONTROL_TOKEN}
    networks:
      - default
      # Deliberately NOT on umbrel_main_network: the dashboard has no auth of
      # its own, so keeping it off the shared network means sibling app
      # containers cannot reach monero_superbrain_dashboard:3000 directly and
      # change mining settings/wallet. Umbrel's app gateway reaches it over
      # this app's own default bridge instead (published monerod RPC on the
      # host covers node access; control-proxy covers container control).
      - control
    volumes:
      # No /var/run/docker.sock here — App Store gate. The control-proxy sidecar
      # is the only container that touches the socket, and it is isolated on the
      # internal `control` network.
      - ${APP_DATA_DIR:-/data}:/data
      - /home/umbrel/umbrel/app-data/monero:/home/umbrel/umbrel/app-data/monero:ro

  # Scoped Docker control sidecar. Holds the host socket but exposes ONLY a
  # token-gated, allowlisted set of operations on this app's own containers
  # (start/stop/restart, logs, minimal inspect, one read-only exec probe).
  # Joins only the internal `control` network, shared with the dashboard. It is
  # not on `default` or `umbrel_main_network`, so p2pool/xmrig/tor/app_proxy
  # cannot reach it.
  control-proxy:
    image: sirjamzalot/superbrain-control-proxy:v1.0
    container_name: monero_superbrain_control_proxy
    restart: always
    environment:
      - CONTROL_TOKEN=${CONTROL_TOKEN}
      - CONTROL_BIND=0.0.0.0
      - CONTROL_PORT=2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control

  # Tor SOCKS proxy for private observer API access (no VPN on Umbrel).
  # Custom current Tor (alpine-based, multi-arch); getumbrel/tor is abandoned
  # since 2022 and no longer bootstraps. Self-contained: SOCKS on 9050 baked in,
  # no mounts. Joins the default network list-form (no static IP) so it does not
  # conflict with Umbrel's network patching; the dashboard reaches it by DNS name.
  tor:
    image: sirjamzalot/superbrain-tor:v1.4.2
    container_name: monero_superbrain_tor
    restart: on-failure
    networks:
      - default

  p2pool:
    image: sirjamzalot/superbrain-p2pool:v1.4.1
    container_name: monero_superbrain_p2pool
    restart: always
    environment:
      - WALLET_ADDRESS=${WALLET_ADDRESS:-43sEimq64TtLoBaEzzxf7wVd4XcZPuGtNRP7zhT7WAgB3th9dvCrJMad99pZNKBRDmJXXXUxeZie7W5tsm7TWVrPHbxvins}
      - DEV_WALLET=${DEV_WALLET:-43sEimq64TtLoBaEzzxf7wVd4XcZPuGtNRP7zhT7WAgB3th9dvCrJMad99pZNKBRDmJXXXUxeZie7W5tsm7TWVrPHbxvins}
      - DEV_FEE_PERCENT=${DEV_FEE_PERCENT:-1}
      - P2POOL_CHAIN=${P2POOL_CHAIN:-mini}
      - APP_MONERO_NODE_IP=${APP_MONERO_NODE_IP:-monero_monerod_1}
      - APP_MONERO_RPC_PORT=${APP_MONERO_RPC_PORT:-18081}
      - APP_MONERO_ZMQ_PORT=${APP_MONERO_ZMQ_PORT:-18083}
      - APP_MONERO_RPC_USER=${APP_MONERO_RPC_USER:-monero}
      - APP_MONERO_RPC_PASS=${APP_MONERO_RPC_PASS:-monero}
    entrypoint: /bin/sh
    command: /data/scripts/start-p2pool.sh
    ports:
      - "3333:3333"
      - "37889:37889"
    volumes:
      - ${APP_DATA_DIR:-/data}:/data
      - /home/umbrel/umbrel/app-data/monero:/monero-app:ro
    networks:
      - default
      - umbrel_main_network

  xmrig-proxy:
    image: sirjamzalot/superbrain-proxy:v1.1
    container_name: monero_superbrain_proxy
    restart: always
    depends_on:
      - p2pool
    command: xmrig-proxy -o p2pool:3333 -u SuperbrainProxy -b 0.0.0.0:8888 --http-host 0.0.0.0 --http-port 8080 --http-access-token superbrain
    ports:
      - "8888:8888"
    volumes:
      - ${APP_DATA_DIR:-/data}/proxy:/data
    networks:
      - default

  xmrig:
    image: sirjamzalot/superbrain-xmrig:v1.1
    container_name: monero_superbrain_xmrig
    restart: always
    # privileged:true removed — it grants host-root-equivalent access and the
    # App Store requires justification for it. The start script now attempts
    # the hugepages sysctl best-effort and mines without it if denied, so full
    # privilege is not required for the default path.
    depends_on:
      - xmrig-proxy
    environment:
      - XMRIG_THREADS=${XMRIG_THREADS:-0}
    entrypoint: /bin/sh
    command: /data/scripts/start-xmrig.sh
    volumes:
      - ${APP_DATA_DIR:-/data}:/data
    networks:
      - default

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 10.99.99.0/24
  control:
    # Isolates the Docker-socket sidecar from the mining/app network.
    internal: true
  umbrel_main_network:
    external: true

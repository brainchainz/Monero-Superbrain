manifestVersion: 1.1
id: brainchainz-monero-superbrain
category: utilities
name: Monero Superbrain
icon: https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superbrain/icon.png
version: "1.3.0"
tagline: Decentralized Monero mining with P2Pool, XMRig, and web dashboard
description: >-
  Complete Monero mining setup featuring decentralized mining pool (P2Pool), miner connection manager (XMRig-proxy),
  CPU miner (XMRig), and a web dashboard for monitoring and control. Connects to your existing Umbrel Monero node.
  Supports LAN workers, Tailscale connections, and custom Monero node selection.
developer: SirJamzAlot
website: https://x.com/MgkMshrmBrkfst
repo: https://github.com/brainchainz/Monero-Superbrain
support: https://github.com/brainchainz/Monero-Superbrain/issues
port: 3000
dependencies:
  - monero
gallery:
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superbrain/gallery/1.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superbrain/gallery/2.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superbrain/gallery/3.png
  - https://raw.githubusercontent.com/brainchainz/Monero-Superbrain/main/brainchainz-monero-superbrain/gallery/4.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  v1.3.0: Updated P2Pool to v4.16. This is a recommended security update that
  fixes a P2Pool consensus vulnerability, hardens the P2P network code, and
  enforces a minimum Stratum difficulty. Nodes on older versions should update
  promptly to stay on consensus.
  v1.2.0: Updated P2Pool to v4.15.1, includes I2P support, improved sync
  stability, new logging controls, memory leak fixes, and updated internal
  dependencies (RandomX, curl, libuv, BoringSSL). Also fixes a rare P2P
  sync bug and the "final reward" display issue in block templates.
  v1.1.4: Chain normalization fix: bare chain names from .env (mini/nano/main) are now
  correctly handled alongside p2pool-style flags (--mini/--nano/--main). Active chain detection
  uses p2pool process cmdline to avoid mainnet false positives. Dashboard UI chain badge
  now stays in sync with backend.
  v1.1.3: Custom Monero node picker now fully functional, selecting a node writes config
  and auto-restarts P2Pool to connect to it. Dashboard API syncs with active node config.
  Thread slider fix: XMRig now sources /data/.env so slider changes take effect on restart.
  Default chain changed to P2Pool mini for faster rewards. Dashboard container names fixed.
  v1.1.0: Custom Monero node picker UI, chain selector (main/mini/nano), updated dashboard.
